name: ci

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_USER: hcc
          POSTGRES_PASSWORD: hcc
          POSTGRES_DB: hcc
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hcc -d hcc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgresql+asyncpg://hcc:hcc@localhost:5432/hcc
      REDIS_URL: redis://localhost:6379/0
      SESSION_SECRET: ci-session-secret
      ENCRYPTION_KEY: ci-encryption-key
      OWNER_EMAIL: owner@apexhealth.dev
      OWNER_PASSWORD: ci-owner-password

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Run tests (migrations are applied by the test session itself)
        working-directory: backend
        run: uv run pytest -q
