# Container dashboard provider for the compose Grafana service (infra/grafana).
# Shadows the host-run grafana/provisioning/dashboards/provider.yml (whose
# path points at the sandbox checkout) — dashboards are bind-mounted at
# /var/lib/grafana/dashboards by infra/docker-compose.yml.
apiVersion: 1
providers:
  - name: Apex Health
    orgId: 1
    folder: Apex Health
    folderUid: apex-health
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
