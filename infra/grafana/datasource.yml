# Container-network datasource for the compose Grafana service (infra/grafana).
# Shadows the host-run grafana/provisioning/datasources/datasource.yml
# (which points at 127.0.0.1:5433) when mounted by infra/docker-compose.yml.
# grafana_ro is created by grafana/sql/bootstrap.sql (SELECT grants only) —
# applied automatically on first db init, or manually via the one-liner in
# the compose file header comment.
apiVersion: 1
deleteDatasources:
  - name: Apex Health DB
    orgId: 1
datasources:
  - name: Apex Health DB
    uid: apex-pg
    type: postgres
    access: proxy
    url: db:5432
    user: grafana_ro
    database: hcc
    secureJsonData:
      password: grafana_ro_dev
    jsonData:
      sslmode: disable
      postgresVersion: 1600
      timescaledb: true
      maxOpenConns: 20
      connMaxLifetime: 14400
    isDefault: true
    readOnly: true
    editable: false
