# Grafana config for the temporary Apex Health web UI.
# Started via grafana/run_grafana.sh — runtime data lives outside the repo
# in /home/z/grafana-runtime. Temporary UI until the real dashboard is built.
app_mode = production

[server]
protocol = http
http_addr = 0.0.0.0
http_port = 3001
domain = localhost
enforce_domain = false

[paths]
data = /home/z/grafana-runtime/data
logs = /home/z/grafana-runtime/logs
plugins = /home/z/grafana-runtime/plugins
provisioning = /home/z/apex-health-clone/grafana/provisioning

[security]
admin_user = admin
admin_password = apex-demo
disable_initial_admin_creation = false

[users]
default_theme = dark

[auth.anonymous]
enabled = true
org_name = Main Org.
org_role = Viewer
hide_version = true

[analytics]
reporting_enabled = false
check_for_updates = false

[news]
news_feed_enabled = false
