# Read-only PostgreSQL datasource for the temporary Grafana UI.
# grafana_ro is created by grafana/sql/bootstrap.sql (SELECT grants only).
apiVersion: 1
deleteDatasources:
  - name: Apex Health DB
    orgId: 1
datasources:
  - name: Apex Health DB
    uid: apex-pg
    type: postgres
    access: proxy
    url: 127.0.0.1:5433
    user: grafana_ro
    database: hcc
    secureJsonData:
      password: grafana_ro_dev
    jsonData:
      sslmode: disable
      postgresVersion: 1600
      timescaledb: true
      maxOpenConns: 20
      connMaxLifetime: 14400
    isDefault: true
    readOnly: true
    editable: false
