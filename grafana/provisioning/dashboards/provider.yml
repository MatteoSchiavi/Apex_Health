# File-based dashboard provisioning — dashboards live in the repo so they are
# versioned with the project and survive Grafana restarts.
apiVersion: 1
providers:
  - name: Apex Health
    orgId: 1
    folder: Apex Health
    folderUid: apex-health
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /home/z/apex-health-clone/grafana/dashboards
      foldersFromFilesStructure: false
